[project]
name = "acb-delta-api"
version = "0.1.0"
description = "FastAPI backend: documents, impacts, HITL decisions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pgvector>=0.3",
    "boto3>=1.35",
    "langchain-core>=0.3",
    "langchain-postgres>=0.0.12",
    "langchain-openai>=0.3",
    "langchain-google-genai>=4.4.2",
    "underthesea>=9.5",
    "falkordb>=1.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
