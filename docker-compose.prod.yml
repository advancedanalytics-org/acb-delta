# Production / vServer Compose: self-contained stack for single-server deployment.
# Only frontend exposes ports 80 and 443; all other services are internal to the Docker network.
name: acb-delta-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Knowledge graph of documents, clauses and legal references (Engine 1 expansion).
  falkordb:
    image: falkordb/falkordb:latest
    environment:
      BROWSER: 0
    volumes:
      - falkordata:/var/lib/falkordb/data
    healthcheck:
      test: redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: cgr.dev/chainguard/minio-client
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: [mb, --ignore-existing, "local/${S3_BUCKET:-documents}"]
    depends_on:
      minio:
        condition: service_healthy

  agent:
    build: ./agent
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_STRUCTURED_METHOD: ${LLM_STRUCTURED_METHOD:-json_schema}
      CORPUS_PATH: /data/corpus.json
      MAX_CHANGES: ${MAX_CHANGES:-10}
      RETRIEVE_K: ${RETRIEVE_K:-5}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./frontend/src/api/mock/fixtures/demo-documents.json:/data/corpus.json:ro
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      AGENT_URL: http://agent:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_BACKEND: s3
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
      REVIEW_DRAFT_CONCURRENCY: ${REVIEW_DRAFT_CONCURRENCY:-4}
      REVIEW_AUTO_START: ${REVIEW_AUTO_START:-true}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_BACKEND: ${RERANK_BACKEND:-rerank}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      JEV_MODEL: ${JEV_MODEL:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      FALKORDB_URL: redis://falkordb:6379
      CORS_ORIGINS: '["http://localhost","https://localhost","http://localhost:${HTTP_PORT:-80}","https://localhost:${HTTPS_PORT:-443}"]'
    depends_on:
      falkordb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/data:ro
      - ./frontend/public/demo:/frontend/public/demo:ro
      - ./db:/db:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  falkordata:
  miniodata:
  certs:
