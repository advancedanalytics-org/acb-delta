# LiteLLM proxy on the GCP demo VM: one OpenAI-compatible endpoint for the api and agent.
# Vertex AI wants short-lived Google tokens, not a fixed key. LiteLLM fetches them from the VM's
# service account (acb-delta-vm, roles/aiplatform.user + roles/discoveryengine.viewer,
# cloud-platform scope), so no key is stored.
model_list:
  # Gemini 3.8 Flash, served by Vertex AI in the "global" location.
  - model_name: gemini-3.8-flash
    litellm_params:
      model: vertex_ai/gemini-3.8-flash
      vertex_project: acb-delta-demo-2340
      vertex_location: global

  # Vertex AI Ranking API (Discovery Engine), exposed as a Cohere-style POST /v1/rerank, which is
  # the shape backend/app/ria/rerank.py calls. Needs discoveryengine.googleapis.com enabled.
  - model_name: semantic-ranker-default
    litellm_params:
      model: vertex_ai/semantic-ranker-default@latest
      vertex_project: acb-delta-demo-2340
      vertex_location: global

litellm_settings:
  # One analyze run makes up to 200 parallel calls; retry Vertex's 429 / 5xx instead of failing the pair.
  num_retries: 2
  telemetry: false
