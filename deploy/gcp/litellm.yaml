# LiteLLM proxy on the GCP demo VM: one OpenAI-compatible endpoint for the api and agent.
# Vertex AI wants short-lived Google tokens, not a fixed key. LiteLLM fetches them from the VM's
# service account (acb-delta-vm, roles/aiplatform.user, cloud-platform scope), so no key is stored.
model_list:
  # Qwen3-Next-80B Instruct, served by Vertex AI (Model as a Service). Only the "global"
  # location has it; us-south1 returns 404. The Instruct variant has no thinking mode.
  - model_name: qwen3-next-80b
    litellm_params:
      model: vertex_ai/qwen/qwen3-next-80b-a3b-instruct-maas
      vertex_project: acb-delta-demo-2340
      vertex_location: global

litellm_settings:
  # One analyze run makes up to 200 parallel calls; retry Vertex's 429 / 5xx instead of failing the pair.
  num_retries: 2
  telemetry: false
