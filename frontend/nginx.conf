server {
    listen 3000;
    root /usr/share/nginx/html;

    # Allow uploading larger PDF documents (default is 1M which triggers 413 Request Entity Too Large)
    client_max_body_size 100M;

    # Same relative /api as the Vite dev proxy, so the image needs no rebuild per environment.
    # Docker's DNS, re-resolved so a recreated api container does not leave a stale IP (502s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 100M;
    }

    # The PDF.js worker is an ES module (.mjs); nginx's default mime.types does not map it,
    # and browsers refuse module workers served as application/octet-stream.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes like /review/:id resolve to index.html.
    # index.html is never cached, so a redeploy cannot leave it pointing at deleted asset hashes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
