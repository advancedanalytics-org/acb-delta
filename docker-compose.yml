# Whole stack on one machine. Start: docker compose up -d --build --wait
# Every value comes from .env (see .env.example); Phase 2 swaps env values, not code.
name: acb-delta

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # minio/minio is no longer pullable from Docker Hub; Chainguard ships the same server.
    image: cgr.dev/chainguard/minio
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports:
      - 127.0.0.1:${MINIO_PORT:-9000}:9000
      - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - miniodata:/data
    healthcheck:
      # No curl or grep in the image; plain bash reads the liveness endpoint's status line.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    # One-shot: create the documents bucket, then exit.
    image: cgr.dev/chainguard/minio-client
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: [mb, --ignore-existing, "local/${S3_BUCKET:-documents}"]
    depends_on:
      minio:
        condition: service_healthy

  agent:
    build: ./agent
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_STRUCTURED_METHOD: ${LLM_STRUCTURED_METHOD:-json_schema}
      # Skeleton retriever reads the demo corpus until MINH-01's vector search replaces it.
      CORPUS_PATH: /data/corpus.json
      MAX_CHANGES: ${MAX_CHANGES:-10}
      RETRIEVE_K: ${RETRIEVE_K:-5}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      # AgentBase Runtime contract: the container always listens on 8080.
      - ${AGENT_PORT:-8080}:8080
    volumes:
      - ./frontend/src/api/mock/fixtures/demo-documents.json:/data/corpus.json:ro
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      AGENT_URL: http://agent:8080
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Uploaded VBPL originals are kept immutable in the bucket.
      STORAGE_BACKEND: s3
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Optional LLM judge for impact analysis; empty = rule-based comparison.
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-4}
      REVIEW_DRAFT_CONCURRENCY: ${REVIEW_DRAFT_CONCURRENCY:-4}
      REVIEW_AUTO_START: ${REVIEW_AUTO_START:-true}
      # Optional reranker for Engine 1 (Cohere/Jina-style /rerank); empty = relevance gate.
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3000}","http://localhost:5173"]'
    ports:
      - ${API_PORT:-8000}:8000
    volumes:
      - ./data:/data:ro
      - ./frontend/public/demo:/frontend/public/demo:ro
      - ./db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
