name: Deploy to GCP

# Every push to main ships that commit to the demo VM (scripts/gcp.sh deploy).
# GCP access is keyless: GitHub's OIDC token is exchanged through Workload Identity
# Federation, whose provider only accepts this repo's refs/heads/main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer push waits instead of interrupting a running build.
concurrency:
  group: deploy-gcp
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to GCP VM
    # Manual runs are only accepted from main, the one ref the identity provider trusts.
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT != ''
    # GitHub-hosted: the shared self-hosted runner must not hold cloud credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Logs of this public repo are public: gcp.sh prints only the URL when CI is set.
      - name: Deploy
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
          GCP_REF: ${{ github.sha }}
        run: ./scripts/gcp.sh deploy
